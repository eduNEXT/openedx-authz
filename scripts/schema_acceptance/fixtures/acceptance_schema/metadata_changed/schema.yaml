schema_version: "1.0"
priority: 900
permission_categories:
  - id: acceptance_category
    display_name: Acceptance
    description: Disposable acceptance-test definitions.
permissions:
  - namespace: acceptance
    name: view
    display_name: View acceptance object
    description: View the disposable object.
    category_id: acceptance_category
    scopes: [course-v1]
  - namespace: acceptance
    name: edit
    display_name: Edit acceptance object
    description: Edit the disposable object.
    category_id: acceptance_category
    scopes: [course-v1]
roles:
  - id: acceptance_editor
    display_name: Acceptance editor renamed
    description: Disposable acceptance role with changed metadata.
    scopes: [course-v1]
    permissions: [acceptance.view, acceptance.edit]
