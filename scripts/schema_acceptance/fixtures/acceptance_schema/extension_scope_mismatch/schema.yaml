schema_version: "1.0"
priority: 100
permission_categories:
  - {id: acceptance_category, display_name: Acceptance, description: Base category.}
permissions:
  - {namespace: acceptance, name: view, display_name: View, description: View., category_id: acceptance_category, scopes: [course-v1]}
  - {namespace: acceptance, name: library, display_name: Library, description: Library., category_id: acceptance_category, scopes: [lib]}
roles:
  - {id: acceptance_editor, display_name: Acceptance editor, description: Base role., scopes: [course-v1], permissions: [acceptance.view]}
role_extensions:
  - {role_id: acceptance_editor, add_permissions: [acceptance.library]}
