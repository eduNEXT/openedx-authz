schema_version: "1.0"
priority: 100

roles:
  - id: base_role
    display_name: Base role
    description: Role extended below.

role_extensions:
  - role: base_role
    display_name: Base role (renamed)
  - role: base_role_desc_only
    description: Extension with description only.
  - role: base_role_both
    display_name: Both overridden
    description: Both fields overridden.
  - role: base_role_neither
    permissions:
      add: [test.percent]
  - role: role_that_does_not_exist
    display_name: Extension for an unknown role
